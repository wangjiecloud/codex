                - heading "国家税务总局深圳市税务局党委委员、副局长吴德接受纪律审查和监察调查" [level=3] [ref=e666] [cursor=pointer]
                - paragraph [ref=e667] [cursor=pointer]: 国家税务总局深圳市税务局党委委员、副局长吴德涉嫌严重违纪违法，目前正接受中央纪委国家监委驻国家税务总局纪检监察组纪律审查和广东省湛江市监察委员会监察调查。（人民财讯）
              - generic [ref=e673]:
                - generic [ref=e675]: 11:13
                - heading "英国6月最高气温纪录连续3天被打破" [level=3] [ref=e676] [cursor=pointer]
                - paragraph [ref=e677] [cursor=pointer]: 当地时间6月26日，英国气象局发布的最新数据显示，当天在该国萨福克郡录得37.3摄氏度的高温，连续3天刷新该国6月最高气温纪录。持续的热浪侵袭使英国6月的气温纪录近期多次被刷新。24日、25日两天都出现破纪录高温，26日再次刷新纪录。在这周之前，英国有记录的6月最高气温为35.6摄氏度，在1957年和1976年都录得该温度。（央视新闻）
              - generic [ref=e683]:
                - generic [ref=e685]: 11:04
                - heading "开山集团土耳其伊兹密尔压缩机工厂建成投产" [level=3] [ref=e686] [cursor=pointer]
                - paragraph [ref=e687] [cursor=pointer]: 当地时间2026年6月26日下午，开山集团土耳其伊兹密尔压缩机工厂(KCT)建成投产。工厂具备完整的空气压缩机制造能力，涵盖主机制造、整机装配生产及测试等全流程制造环节。这是开山集团在海外布局的第三座工厂，是面向北美、欧洲市场的重要制造基地。工厂达产后预计可实现年产值约5000万美元。（人民财讯）
              - generic [ref=e693]:
                - generic [ref=e695]: 11:03
                - heading "纳米比亚旅游局首席执行官：将进一步加强对华旅游合作，大力吸引中国游客" [level=3] [ref=e696] [cursor=pointer]
                - paragraph [ref=e697] [cursor=pointer]: 纳米比亚旅游局首席执行官塞布隆·奇卡卢26日在首都温得和克举行的业界会议上说，纳米比亚将进一步加强对华旅游合作，大力吸引中国游客。此次业界会议以“加强伙伴关系，促进中国旅游市场增长”为主题。奇卡卢说，中国是全球最具活力的出境旅游市场之一，纳米比亚高度重视中国市场的战略价值，拓展中国市场对于该国旅游业可持续增长至关重要。奇卡卢说，纳旅游局将继续提升该国旅游目的地认知度，开发创新旅游产品，将纳米比亚打造为中国游客难忘的非洲旅游目的地。根据最近发布的游客到访统计报告，2025年中国首次进入纳米比亚前十大海外旅游客源市场。（新华社）
              - generic [ref=e703]:
                - generic [ref=e705]: 10:55
                - heading "115家中外企业签约参展第五届中国国际供应链促进博览会" [level=3] [ref=e706] [cursor=pointer]
                - paragraph [ref=e707] [cursor=pointer]: 2026年6月26日，第五届链博会参展签约仪式暨2026年链博会参展商联盟大会在北京举行。会上，霍尼韦尔、GE医疗、西门子、康宁、住友电工等115家中外企业及机构，与链博会承办单位中展集团签署第五届展会参展意向协议。（人民财讯）
              - generic [ref=e713]:
                - generic [ref=e715]: 10:48
                - heading "我国在聚变堆超导磁体研发领域取得新突破" [level=3] [ref=e716] [cursor=pointer]
                - paragraph [ref=e717] [cursor=pointer]: 中国科学院合肥物质科学研究院等离子体物理研究所“人造太阳”项目取得最新进展，环向场超导磁体、高温超导中心螺管线圈等两套聚变堆关键超导磁体先后完成研制验收与满参数测试，核心技术实现100%国产化，综合性能跃升至国际前列。（新华社）
              - generic [ref=e723]:
                - generic [ref=e725]: 10:42
                - heading "德媒：大众汽车计划扩大裁员规模至10万人" [level=3] [ref=e726] [cursor=pointer]
                - paragraph [ref=e727] [cursor=pointer]: 德国《经理人杂志》26日报道，德国汽车制造商大众汽车集团计划扩大裁员规模至10万人，同时关停4家德国工厂。这或将成为该集团成立以来的最大规模重组。这家媒体援引消息人士的话报道，大众汽车计划在今年3月宣布削减约5万个岗位的基础上，进一步将削减岗位数增至10万个。2025财年，大众汽车在全球共有约66.7万名员工，近43%在德国工作。（新华社）
              - generic [ref=e733]:
                - generic [ref=e735]: 10:40
                - heading "伊朗革命卫队：打击美军多个目标以回应美空袭伊朗" [level=3] [ref=e736] [cursor=pointer]
                - paragraph [ref=e737] [cursor=pointer]: 伊朗伊斯兰革命卫队27日发表声明说，革命卫队海军已对中东地区美军多个目标实施打击，以回应美方对伊朗沿海地区的空袭。声明说，继以色列在黎巴嫩南部违反停火协议之后，美国再一次“违背承诺”，以“船只在霍尔木兹海峡违规航行”为由，对伊朗沿海地区发动空袭。声明说，根据伊美谅解备忘录，霍尔木兹海峡的交通管制安排由伊朗负责。然而，美国煽动有关方面试图加以破坏，伊方已对此作出必要回应。若再次发生侵犯行为，伊方回应将更加严厉。（新华社）
              - generic [ref=e743]:
                - generic [ref=e745]: 10:32
                - heading "西康高铁全线进入联调联试阶段" [level=3] [ref=e746] [cursor=pointer]
                - paragraph [ref=e747] [cursor=pointer]: 6月27日上午，西康高铁正式进入联调联试阶段。联调联试是高铁从建设阶段迈向运营阶段的关键环节，如同为线路开展“全身体检”。此次西康高铁联调联试，铁路部门通过模拟开通运营的行车状态，对轨道、路基、桥隧、供电、信号、通信、客服等各系统及接口匹配关系进行综合检测、验证与优化，及时发现并整改设备运行中的问题，为线路开通运营提供重要的技术保障。（央视新闻）
              - generic [ref=e753]:
                - generic [ref=e755]: 10:32
                - heading "韩国政府组建跨部门机构应对涉AI犯罪" [level=3] [ref=e756] [cursor=pointer]
                - paragraph [ref=e757] [cursor=pointer]: 韩国政府26日组建一个跨部门协商机构，以应对“数字性犯罪”、金融诈骗、虚假广告等利用人工智能(AI)技术实施的犯罪行为。这一新机构名为“应对涉AI犯罪跨部门协商机构”，成员分别来自广播媒体通信委员会、科学技术信息通信部、性别平等家族部、金融委员会、警察厅等10个政府部门。按韩国媒体说法，随着涉AI犯罪日益猖獗，单一机构通常难以应对，因此有必要设立跨部门机构协同配合。韩国广播媒体通信委员会26日牵头召开启动会议，讨论制定应对相关犯罪的方案。与会人员表示，各政府部门将在涉AI犯罪的各环节展开合作，包括预防、调查、执法和信息共享等，同时为受害者提供支持。（新华社）
