                - heading "沙特重启海湾原油出口终端" [level=3] [ref=e602] [cursor=pointer]
                - paragraph [ref=e603] [cursor=pointer]: 专业机构提供的数据显示，沙特阿拉伯国家石油公司（沙特阿美）26日在时隔近4个月后重启其海湾一侧的石油出口终端，开始为超大型油轮装货。欧盟“哥白尼哨兵”卫星系统26日拍摄的图像显示，沙特东部塔努拉角油港当天已经恢复运转，有两艘可装200万桶原油的超大型油轮正在港口装货，另一艘油轮在附近等待，第四艘油轮正驶向港口。正在装货的油轮由沙特巴赫里航运公司运营。（央视新闻）
