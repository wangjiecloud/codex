                - paragraph [ref=e717] [cursor=pointer]: 中国科学院合肥物质科学研究院等离子体物理研究所“人造太阳”项目取得最新进展，环向场超导磁体、高温超导中心螺管线圈等两套聚变堆关键超导磁体先后完成研制验收与满参数测试，核心技术实现100%国产化，综合性能跃升至国际前列。（新华社）
              - generic [ref=e723]:
                - generic [ref=e725]: 10:42
                - heading "德媒：大众汽车计划扩大裁员规模至10万人" [level=3] [ref=e726] [cursor=pointer]
                - paragraph [ref=e727] [cursor=pointer]: 德国《经理人杂志》26日报道，德国汽车制造商大众汽车集团计划扩大裁员规模至10万人，同时关停4家德国工厂。这或将成为该集团成立以来的最大规模重组。这家媒体援引消息人士的话报道，大众汽车计划在今年3月宣布削减约5万个岗位的基础上，进一步将削减岗位数增至10万个。2025财年，大众汽车在全球共有约66.7万名员工，近43%在德国工作。（新华社）
              - generic [ref=e733]:
                - generic [ref=e735]: 10:40
                - heading "伊朗革命卫队：打击美军多个目标以回应美空袭伊朗" [level=3] [ref=e736] [cursor=pointer]
                - paragraph [ref=e737] [cursor=pointer]: 伊朗伊斯兰革命卫队27日发表声明说，革命卫队海军已对中东地区美军多个目标实施打击，以回应美方对伊朗沿海地区的空袭。声明说，继以色列在黎巴嫩南部违反停火协议之后，美国再一次“违背承诺”，以“船只在霍尔木兹海峡违规航行”为由，对伊朗沿海地区发动空袭。声明说，根据伊美谅解备忘录，霍尔木兹海峡的交通管制安排由伊朗负责。然而，美国煽动有关方面试图加以破坏，伊方已对此作出必要回应。若再次发生侵犯行为，伊方回应将更加严厉。（新华社）
              - generic [ref=e743]:
                - generic [ref=e745]: 10:32
                - heading "西康高铁全线进入联调联试阶段" [level=3] [ref=e746] [cursor=pointer]
                - paragraph [ref=e747] [cursor=pointer]: 6月27日上午，西康高铁正式进入联调联试阶段。联调联试是高铁从建设阶段迈向运营阶段的关键环节，如同为线路开展“全身体检”。此次西康高铁联调联试，铁路部门通过模拟开通运营的行车状态，对轨道、路基、桥隧、供电、信号、通信、客服等各系统及接口匹配关系进行综合检测、验证与优化，及时发现并整改设备运行中的问题，为线路开通运营提供重要的技术保障。（央视新闻）
              - generic [ref=e753]:
                - generic [ref=e755]: 10:32
                - heading "韩国政府组建跨部门机构应对涉AI犯罪" [level=3] [ref=e756] [cursor=pointer]
                - paragraph [ref=e757] [cursor=pointer]: 韩国政府26日组建一个跨部门协商机构，以应对“数字性犯罪”、金融诈骗、虚假广告等利用人工智能(AI)技术实施的犯罪行为。这一新机构名为“应对涉AI犯罪跨部门协商机构”，成员分别来自广播媒体通信委员会、科学技术信息通信部、性别平等家族部、金融委员会、警察厅等10个政府部门。按韩国媒体说法，随着涉AI犯罪日益猖獗，单一机构通常难以应对，因此有必要设立跨部门机构协同配合。韩国广播媒体通信委员会26日牵头召开启动会议，讨论制定应对相关犯罪的方案。与会人员表示，各政府部门将在涉AI犯罪的各环节展开合作，包括预防、调查、执法和信息共享等，同时为受害者提供支持。（新华社）
