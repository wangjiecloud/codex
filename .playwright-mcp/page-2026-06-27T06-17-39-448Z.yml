                - heading "以总理称以军将长期驻留黎巴嫩南部" [level=3] [ref=e626] [cursor=pointer]
                - paragraph [ref=e627] [cursor=pointer]: 当地时间6月26日，以色列与黎巴嫩就以军从黎南部部分地区撤军达成框架协议。以色列总理内塔尼亚胡当天发表电视讲话称，根据协议，以军将继续驻留在其控制的“绝大部分”黎南部“安全区”内，他还称这是“以色列的重大成就”。内塔尼亚胡称，只要以色列仍面临威胁，以军将继续驻留在“安全区”，并拒绝黎巴嫩真主党和当地居民进入相关区域。内塔尼亚胡还说，这项协议也是对伊朗的“一次重大打击”。(CCTV国际时讯)
              - generic [ref=e633]:
                - generic [ref=e635]: 12:41
                - heading "全国13条河流发生超警洪水" [level=3] [ref=e636] [cursor=pointer]
                - paragraph [ref=e637] [cursor=pointer]: 记者从水利部了解到，受降雨影响，昨天到今天，广西西江桂平江段及支流白沙江、红水河支流盘阳河、郁江支流猪儿河、画眉河、武思江及桂南沿海南流江，广东西江支流蟠龙水、北江支流水边河，云南澜沧江支流凤庆河，福建闽江支流吉木溪、文江溪，内蒙古额尔古纳河支流海拉尔河等13条河流发生超警洪水，最大超警幅度0.86米，目前大部已退至警戒以下。（央视新闻）
              - generic [ref=e643]:
                - generic [ref=e645]: 12:41
                - heading "伊朗称受袭锡里克港运营正常" [level=3] [ref=e646] [cursor=pointer]
                - paragraph [ref=e647] [cursor=pointer]: 伊朗霍尔木兹甘省有关负责人表示，受到袭击的锡里克港目前运营正常，港口设备和设施并未受损。26日，锡里克一处码头当晚传出数次爆炸声。消息人士表示，爆炸起因是码头遭发射物击中。还有消息称两枚发射物击中了该地区的一座电信塔。27日凌晨，美国袭击了伊朗锡里克地区。当地消息人士称，当地时间26日23时30分左右，霍尔木兹甘省锡里克地区发生数次爆炸。（央视新闻）
              - generic [ref=e653]:
                - generic [ref=e655]: 12:41
                - heading "委内瑞拉官员：石油生产未受地震影响" [level=3] [ref=e656] [cursor=pointer]
                - paragraph [ref=e657] [cursor=pointer]: 委内瑞拉官员：石油生产未受地震影响 委内瑞拉接连发生两次强震后，当地时间6月26日，该国人民政权油气部长葆拉·埃瑙说，石油生产未受地震影响。埃瑙接受媒体采访时说，委内瑞拉目前日均原油产量为120万桶，政府已评估国内库存情况，国内天然气和燃料供应有保障。“我们处于正常运转状态，所有油井在运转和生产中。”据悉，委内瑞拉石油企业管理层和油田工人反馈，油气设施没有受到严重影响。稍早前有消息称，初步评估显示，由于远离受地震波及的城市，委内瑞拉大型油气设施在强震中受损有限，不过电力短缺情况可能影响石油产能。（央视新闻）
              - generic [ref=e663]:
