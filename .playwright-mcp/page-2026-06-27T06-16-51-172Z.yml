                - paragraph [ref=e593] [cursor=pointer]: 海南省住房公积金管理局6月26日发布《关于2026年度住房公积金缴存基数范围的通告》。公告提出，职工住房公积金缴存基数，不低于职工工作所在市县上一年度最低工资标准，不高于职工工作所在市县上一年度职工月平均工资的3倍。通告的住房公积金缴存基数范围适用于城镇非私营单位，城镇私营单位参照标准执行。2026年度住房公积金缴存基数范围适用时间：2026年7月1日至2027年6月30日。（财联社）
