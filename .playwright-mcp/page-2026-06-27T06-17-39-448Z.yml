                - heading "中国大唐与四川省政府签署全面深化战略合作协议" [level=3] [ref=e562] [cursor=pointer]
                - paragraph [ref=e563] [cursor=pointer]: 6月26日，中国大唐与四川省人民政府签署全面深化战略合作协议。根据协议，双方将围绕清洁能源开发利用、能源基础设施建设、能源产业建圈强链、能源科技创新与成果转化等方面开展深入合作，共同培育发展能源新质生产力，更好服务国家发展大局和四川现代化建设。（人民财讯）
              - generic [ref=e569]:
                - generic [ref=e571]: 13:40
                - heading "我国机电产品加速出海 有企业今年以来800G以上光模块出口同比增长超过100倍" [level=3] [ref=e572] [cursor=pointer]
                - paragraph [ref=e573] [cursor=pointer]: 今年前5个月，我国机电产品出口额7.58万亿元，占我国出口总值的比重达到63.6%。自2025年3月起，连续15个月刷新同期月度最高值。记者在浙江嘉兴的一家工厂看到，这里有近1000台织布机正在织布，它是人工智能服务器中的电子布。电子布，是电子信息产业当中的关键材料。随着算力需求爆发，电子布需求也随之增加。企业车间里，产线24小时满产运行。今年以来，和算力有关的相关产品加速出海。在武汉，光模块的生产线同样24小时不停机。随着全球算力基础设施建设加速推进，今年以来，这家企业800G以上光模块出口同比增长超过100倍。数据显示，今年以来，人工智能产业链相关产品贡献了机电产品出口增量的五成以上，成为重要拉动力。（央视财经）
              - generic [ref=e579]:
                - generic [ref=e581]: 13:32
                - heading "娃哈哈回应纯净水涨价" [level=3] [ref=e582] [cursor=pointer]
                - paragraph [ref=e583] [cursor=pointer]: 6月27日，据娃哈哈微博，娃哈哈发布针对近日网传娃哈哈纯净水涨价相关消息的统一说明：受包材成本波动，公司调整不同包装规格水产品的渠道批发价，有升有降以保障经销商伙伴稳定经营。全线纯净水终端零售价不变，消费者购买价格无变化。（人民财讯）
              - generic [ref=e589]:
                - generic [ref=e591]: 13:21
                - heading "海南调整住房公积金缴存基数 7月起执行" [level=3] [ref=e592] [cursor=pointer]
                - paragraph [ref=e593] [cursor=pointer]: 海南省住房公积金管理局6月26日发布《关于2026年度住房公积金缴存基数范围的通告》。公告提出，职工住房公积金缴存基数，不低于职工工作所在市县上一年度最低工资标准，不高于职工工作所在市县上一年度职工月平均工资的3倍。通告的住房公积金缴存基数范围适用于城镇非私营单位，城镇私营单位参照标准执行。2026年度住房公积金缴存基数范围适用时间：2026年7月1日至2027年6月30日。（财联社）
              - generic [ref=e599]:
