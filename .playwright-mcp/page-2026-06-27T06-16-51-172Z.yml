                - paragraph [ref=e563] [cursor=pointer]: 6月26日，中国大唐与四川省人民政府签署全面深化战略合作协议。根据协议，双方将围绕清洁能源开发利用、能源基础设施建设、能源产业建圈强链、能源科技创新与成果转化等方面开展深入合作，共同培育发展能源新质生产力，更好服务国家发展大局和四川现代化建设。（人民财讯）
