                - heading "碳化硅器件价格止跌趋稳 高压MOS、IGBT等产品仍有涨价空间" [level=3] [ref=e612] [cursor=pointer]
                - paragraph [ref=e613] [cursor=pointer]: 三安光电公司人士透露，目前国内的碳化硅功率半导体暂时还没有看到涨价，只能说价格“止跌趋稳”。中科英智基金合伙人王洲表示，碳化硅今年已有反转趋势，高压MOS、IGBT等产品均呈现了比较大的价格上涨的弹性，并且今年下半年可能仍有上涨空间。（科创板日报）
