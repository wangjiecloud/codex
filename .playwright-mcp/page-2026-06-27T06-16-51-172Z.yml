                - paragraph [ref=e657] [cursor=pointer]: 委内瑞拉官员：石油生产未受地震影响 委内瑞拉接连发生两次强震后，当地时间6月26日，该国人民政权油气部长葆拉·埃瑙说，石油生产未受地震影响。埃瑙接受媒体采访时说，委内瑞拉目前日均原油产量为120万桶，政府已评估国内库存情况，国内天然气和燃料供应有保障。“我们处于正常运转状态，所有油井在运转和生产中。”据悉，委内瑞拉石油企业管理层和油田工人反馈，油气设施没有受到严重影响。稍早前有消息称，初步评估显示，由于远离受地震波及的城市，委内瑞拉大型油气设施在强震中受损有限，不过电力短缺情况可能影响石油产能。（央视新闻）
